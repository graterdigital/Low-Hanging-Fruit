# Client file: one per site. Holds WHAT is true about this site, never HOW to do a task.
# No passwords, keys, or tokens in this file. Credentials live in your local SSH config / password manager.
# "unknown" means nobody has checked yet. Skills should fill these in as they learn them.

slug: blushmedspact
name: Blush Med Spa CT
domain: blushmedspact.com
canonical_host: https://blushmedspact.com
vertical: medical-spa

ahrefs:
  site_audit_project_id: 9704526
  gsc_connected: no

platform:
  cms: wordpress
  wp_version: unknown
  theme: salient
  page_builder: wpbakery
  seo_plugin: yoast
  plugins_seen: [contact-form-7, cookie-law-info, custom-financing-widget, google-site-kit, js_composer_salient, salient-core, simple-banner, wp-popups-lite]
  image_optimization_plugin: none-detected
