  gtm_container: none-detected
  google_ads_ids: []
  other_tags: [microsoft-clarity, hubspot, site-kit]
  consent_mode: unknown

local:
  business_profile: unknown
  nap: unknown

ai:
  search_bots: allow            # allow | block: AI search/assistant crawlers (ChatGPT-User, OAI-SearchBot, Claude-SearchBot, PerplexityBot ...). Googlebot is never blocked.
  training_bots: allow          # allow | block: model-training crawlers (GPTBot, ClaudeBot, Google-Extended ...). Agency default is allow; flip to block when the client asks
  exceptions: []                # bot names that flip the verdict above
  indexnow: unknown             # yes | no | unknown: does the site itself ping IndexNow on publish (Microsoft's `indexnow` plugin is the roster standard)
  policy_confirmed_by: "Grater Digital default, Greg 2026-10-30; per-client opt-out on request"

rules:
  visible_copy_changes: approve   # skills may be stricter than their default tier, never looser
  do_not_touch: []
  priority_pages: []

evidence:
  last_checked: 2026-10-28
  basis: "Ahrefs Site Audit raw HTML of https://blushmedspact.com/ (latest crawl) run through scripts/fingerprint.py; GSC checked via Ahrefs gsc-pages for 2026-09-28..2026-10-26. Not verified by logging in. Connecticut med spa on Salient theme + WPBakery; no GTM or GA4 tag found in raw HTML (Site Kit, HubSpot, Clarity present; GA4 may be injected by Site Kit via a path the fingerprint missed); CookieYes banner; NitroPack active."
