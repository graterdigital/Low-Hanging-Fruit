# Client file: one per site. Holds WHAT is true about this site, never HOW to do a task.
# No passwords, keys, or tokens in this file. Credentials live in your local SSH config / password manager.
# "unknown" means nobody has checked yet. Skills should fill these in as they learn them.

slug: theclinique
name: The Clinique (Aesthetic Clinique)
domain: theclinique.com
canonical_host: https://theclinique.com
vertical: medical-spa

ahrefs:
  site_audit_project_id: 9704556
  gsc_connected: no

platform:
  cms: wordpress
  wp_version: unknown
  theme: twentytwentyone-child
  page_builder: elementor
  seo_plugin: yoast
  plugins_seen: [admin-site-enhancements-pro, akismet, custom-financing-widget, g-business-reviews-rating, genesis-blocks, gravityforms, responsive-youtube-vimeo-popup, widget-google-reviews, wp-dlm-faq, wp-popups-lite, google-site-kit]
  image_optimization_plugin: none-detected
  perf_plugins: [nitropack]
  schema_notes: LocalBusiness with AggregateRating in the home-page JSON-LD; two GTM containers load (GTM-KD45X7C, GTM-NXR8Z4MV)

hosting:
  provider: wpengine
  access: ssh+wp-cli
  ssh_alias: theclinique
  staging_environment: theclinique-staging

tracking:
  ga4_measurement_id: G-GX3QTEKF9E
  gtm_container: GTM-KD45X7C
  google_ads_ids: []
  other_tags: [hubspot, gtm-second-container:GTM-NXR8Z4MV]
  consent_mode: unknown

local:
  business_profile: unknown
  nap: unknown

ai:
  search_bots: allow            # allow | block: AI search/assistant crawlers (ChatGPT-User, OAI-SearchBot, Claude-SearchBot, PerplexityBot ...). Googlebot is never blocked.
  training_bots: allow          # allow | block: model-training crawlers (GPTBot, ClaudeBot, Google-Extended ...). Agency default is allow; flip to block when the client asks
  exceptions: []                # bot names that flip the verdict above
  indexnow: unknown             # yes | no | unknown: does the site itself ping IndexNow on publish (Microsoft's `indexnow` plugin is the roster standard)
  policy_confirmed_by: "Grater Digital default, Greg 2026-10-30; per-client opt-out on request"

rules:
  # Tier overrides. Skills may be stricter than their defaults here, never looser.
  visible_copy_changes: approve
  do_not_touch: []
  priority_pages: []

evidence:
  last_checked: 2026-10-28
  basis: Fingerprint of raw HTML of https://theclinique.com/ from the latest Ahrefs Site Audit crawl (site-audit-page-content) plus gsc-pages check for 2026-09-28..2026-10-26. Not verified by logging in.
